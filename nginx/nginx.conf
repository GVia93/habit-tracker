# Кол-во одновременных соединений воркера
events {
    worker_connections 1024;
}

http {
    # Типы MIME и базовые настройки
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Апстрим до Django (Gunicorn в сервисе web)
    upstream django {
        server web:8000;
        keepalive 16;  # держим keep-alive к gunicorn
    }

    server {
        listen       80;
        server_name  _;  # любой хост

        # Отдача статики Nginx-ом
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 7d;
        }

        # Отдача медиа-файлов
        location /media/ {
            alias /app/media/;
            access_log off;
            expires 7d;
        }

        # Прокси на Django
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_read_timeout 60s;   # ожидаем ответ приложения
            proxy_connect_timeout 5s; # таймаут соединения до апстрима
            proxy_redirect off;

            proxy_pass http://django;
        }
    }
}
