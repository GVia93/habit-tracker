name: CI/CD

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Prepare env for tests
        run: |
          cat > .env.test <<'EOF'
          DJANGO_SECRET_KEY=test-secret
          DJANGO_DEBUG=1
          DJANGO_ALLOWED_HOSTS=*
          TIME_ZONE=Europe/Moscow

          DB_NAME=test_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=127.0.0.1
          DB_PORT=5432

          REDIS_URL=redis://127.0.0.1:6379/0
          CORS_ALLOW_ALL_ORIGINS=True
          CSRF_TRUSTED_ORIGINS=http://localhost
          EOF

      - name: Run migrations
        env:
          DOTENV_FILE: .env.test
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          DOTENV_FILE: .env.test
        run: |
          (pytest -q) || python manage.py test -v 2

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/hw_2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            PROJECT_DIR=${{ secrets.PROJECT_DIR || '/srv/habit-tracker' }}
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"

            if [ -d ".git" ]; then
              git fetch --all
            else
              git clone ${{ secrets.GIT_REPO_URL }} .
            fi

            git checkout develop
            git pull --rebase origin develop

            echo "${{ secrets.ENV_PROD }}" > .env
            chmod 600 .env

            sudo docker compose pull
            sudo docker compose up -d --build
            sudo docker compose exec -T web python manage.py migrate --noinput
            sudo docker compose exec -T web python manage.py collectstatic --noinput
