name: CI/CD

on:
  push:
    branches: [ feature/hw_2, develop ]      # триггерим нужные ветки
  pull_request:                               # ПР — запускает lint/tests

concurrency:
  group: habit-tracker-${{ github.ref }}      # один ран статуса на ветку
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: flake8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'                        # кэшируем зависимости

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8                  # на всякий случай, если нет в requirements

      - name: Run flake8
        run: |
          flake8 . --exclude=migrations --count --statistics

  tests:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Migrate & test
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          SECRET_KEY: test_secret_key
        run: |
          python manage.py migrate --noinput
          pytest -q

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/hw_2'

    steps:
      - name: SSH deploy (pull, build, migrate, collectstatic)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          request_pty: true
          command_timeout: 30m
          script: |
              set -euo pipefail
              PROJECT_DIR=/srv/habit-tracker
              REPO="https://github.com/${{ github.repository }}.git"
              BRANCH="${GITHUB_REF_NAME:-develop}"
              
              # 1) Клон (если первый деплой)
              if [ ! -d "$PROJECT_DIR/.git" ]; then
                mkdir -p "$PROJECT_DIR"
                git clone --branch "$BRANCH" --depth 1 "$REPO" "$PROJECT_DIR"
              fi
              
              cd "$PROJECT_DIR"
              
              # 2) Сразу пишем .env (до любых docker compose)
              printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
              chmod 600 .env
              
              # 3) Обновляем код
              git fetch --all --prune
              git reset --hard "origin/$BRANCH"
              git clean -fdx || true
              
              # 4) Чистим статик/медиа из контейнера (root внутри)
              docker compose run --rm -T web sh -lc 'rm -rf /app/staticfiles /app/media || true' || true
              
              # 5) Сборка / запуск (с учётом кэша, см. пункт Б)
              docker compose pull
              docker compose up -d --build --remove-orphans
              
              # 6) Ожидаем БД и выполняем команды Django
              echo "Waiting for DB to be healthy..."
              for i in $(seq 1 30); do
                state=$(docker inspect -f '{{.State.Health.Status}}' habit_db 2>/dev/null || echo "unknown")
                [ "$state" = "healthy" ] && break
                sleep 2
              done

            # Миграции и collectstatic
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
