name: CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:

concurrency:
  group: habit-tracker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 . --exclude=migrations --count --statistics

  tests:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate & test
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          SECRET_KEY: test_secret_key
        run: |
          python manage.py migrate --noinput
          pytest -q

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: SSH deploy (pull, build, migrate, collectstatic)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          request_pty: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            PROJECT_DIR=/srv/habit-tracker
            if [ ! -d "$PROJECT_DIR" ]; then
              mkdir -p "$PROJECT_DIR"
              git clone --branch develop --depth 1 https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            if [ -d ".git" ]; then
              git fetch --all --prune
              git reset --hard origin/develop
              git clean -fdx
            fi

            printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
            chmod 600 .env

            docker compose pull
            docker compose up -d --build

            echo "Waiting for DB to be healthy..."
            # 30 попыток по 2 сек = ~1 минута
            for i in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Health.Status}}' habit_db 2>/dev/null || echo "unknown")
              if [ "$state" = "healthy" ]; then break; fi
              sleep 2
            done

            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
